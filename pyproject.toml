[project]
name = "complaint-dedup-validator"
version = "0.1.0"
description = "LLM-driven complaint duplicate validation workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chardet>=5.2.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.3.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "xlwt>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaint_dedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
