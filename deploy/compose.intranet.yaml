# 内网部署 compose(全自包含:内置 PostgreSQL,无外网依赖)
# 目录布局:
#   compose.intranet.yaml
#   config/.env          ← 由 deploy/env.intranet.example 复制后仅填写模型配置
#   Docker 命名卷 runtime_data ← 运行数据(上传文件/导出结果)
# 使用:
#   docker compose -f compose.intranet.yaml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: complaint_app
      POSTGRES_PASSWORD: complaint_dedup_internal_2026
      POSTGRES_DB: complaint_dedup
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: complaint-dedup-validator-intranet:latest
    restart: unless-stopped
    init: true
    env_file: ./config/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
      APP_TIMEZONE: Asia/Shanghai
      DATABASE_MODE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: complaint_app
      DB_PASSWORD: complaint_dedup_internal_2026
      DB_NAME: complaint_dedup
      PYTHONPATH: /app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runtime_data:/app/runtime
    ports:
      - "28765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: complaint-dedup-validator-intranet:latest
    restart: unless-stopped
    init: true
    env_file: ./config/.env
    environment:
      APP_TIMEZONE: Asia/Shanghai
      DATABASE_MODE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: complaint_app
      DB_PASSWORD: complaint_dedup_internal_2026
      DB_NAME: complaint_dedup
      PYTHONPATH: /app/src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - runtime_data:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    command: ["python", "-m", "complaint_dedup.full_corpus_worker"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  runtime_data:
