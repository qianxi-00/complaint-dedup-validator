services:
  api:
    image: complaint-dedup-validator:latest
    restart: unless-stopped
    init: true
    env_file:
      - ./config/.env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./app:/app:ro
      - ./runtime:/app/runtime
    ports:
      - "0.0.0.0:28765:8765"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  worker:
    image: complaint-dedup-validator:latest
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./config/.env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./app:/app:ro
      - ./runtime:/app/runtime
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    command: ["python", "-m", "complaint_dedup.full_corpus_worker"]
